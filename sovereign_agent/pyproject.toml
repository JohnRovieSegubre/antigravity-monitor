[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-agent"
version = "1.0.0"
description = "The reference agent runtime for Sovereign API — auto-wallet, auto-payment, policy enforcement."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Sovereign API"},
]
keywords = ["ai", "agent", "crypto", "x402", "usdc", "sovereign", "llm"]

dependencies = [
    "requests>=2.28",
    "eth-account>=0.9",
]

[project.optional-dependencies]
x402 = [
    "x402[requests]",
]
all = [
    "x402[requests]",
    "web3>=6.0",
]

[project.urls]
Homepage = "https://sovereign-api.com"
Documentation = "https://sovereign-api.com/guide"
Repository = "https://github.com/sovereignapi/sovereign-agent"
