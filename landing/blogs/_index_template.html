<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Intelligence Blog</title>
    <meta name="description"
        content="Technical deep dives, architectural decisions, and the manifesto for autonomous AI agents.">
    <meta name="robots" content="index, follow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">

    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #000000;
            --bg-card: #000000;
            --bg-card-hover: #111111;
            --border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #ffffff;
            --gradient-main: linear-gradient(135deg, #ffffff, #ffffff);
            --font-body: 'Inter', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--text-primary);
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            padding: 16px 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        nav .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 17px;
            color: var(--text-primary);
        }

        .nav-logo .logo-icon {
            display: none;
        }

        .header {
            padding: 160px 0 80px;
            text-align: center;
        }

        .header h1 {
            font-size: clamp(40px, 6vw, 64px);
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 16px;
        }

        .header p {
            font-size: 19px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        .blog-grid {
            display: grid;
            gap: 32px;
            margin-bottom: 100px;
            max-width: 800px;
            margin: 0 auto 100px;
        }

        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0;
            padding: 40px;
            transition: all 0.3s;
            display: block;
            position: relative;
            overflow: hidden;
        }

        .post-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: var(--bg-card-hover);
            transform: translateY(-4px);
        }

        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient-main);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .post-card:hover::before {
            opacity: 1;
        }

        .post-date {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: block;
        }

        .post-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .post-excerpt {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <nav>
        <div class="container">
            <a href="/" class="nav-logo">⚡ Sovereign API</a>
            <a href="/" style="font-size: 14px; font-weight: 500; color: var(--text-secondary);">Back to API</a>
        </div>
    </nav>

    <header class="header">
        <div class="container">
            <h1>Intelligence <span
                    style="color: var(--text-primary); border-bottom: 2px solid var(--accent); padding-bottom: 4px;">Signals</span>
            </h1>
            <p>Architectural decisions, agent economics, and the manifesto for autonomous compute.</p>
        </div>
    </header>

    <main class="container">
        <div class="blog-grid">
            {{ posts_html }}
        </div>
    </main>
</body>

</html>
